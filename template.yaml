# template.yaml
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ru.ingvord.trading.telegram.TelegramWebhookHandler::handleRequest
      CodeUri: /home/ingvord/Projects/psychic-guacamole
      Runtime: java21
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
          WEBHOOK_SECRET_TOKEN: ${WEBHOOK_SECRET_TOKEN}
          ALERTS_TABLE: ${WEBHOOK_SECRET_TOKEN}
          DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
          JAVA_TOOL_OPTIONS: -agentlib:native-image-agent=config-merge-dir=/var/task/src/main/resources/META-INF/native-image
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: POST


